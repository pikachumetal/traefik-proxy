services:
  traefik:
    image: traefik:v3
    container_name: traefik-proxy
    restart: unless-stopped
    command:
      # API / Dashboard
      - --api.dashboard=true
      # Healthcheck
      - --ping=true
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      # File provider (certificados y router del dashboard)
      - --providers.file.directory=/config/dynamic
      - --providers.file.watch=true
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Solo dentro del contenedor, para /ping; debe coincidir con el healthcheck
      - --entrypoints.traefik.address=:8080
      # Redirect HTTP to HTTPS (optional - comment out if not needed)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Logging
      - --log.level=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--entrypoints.traefik.address=:8080"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dynamic:/config/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - traefik-public

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
