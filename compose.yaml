services:
  traefik:
    image: traefik:v3.8.0
    container_name: traefik-proxy
    restart: unless-stopped
    # El margen sobre el consumo normal evita alcanzar el límite con LOG_LEVEL=DEBUG
    mem_limit: 256m
    cpus: 1.0
    # Lee docker.sock: si lo comprometen, que no escale privilegios, no escriba en el contenedor y solo pueda abrir puertos <1024
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      # API y dashboard (por el router de config/dynamic/dashboard.yml)
      - --api.dashboard=true
      # Endpoint /ping para el healthcheck
      - --ping=true
      # Provider Docker
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      # Provider File (certificados y router del dashboard)
      - --providers.file.directory=/config/dynamic
      - --providers.file.watch=true
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Solo dentro del contenedor, para /ping; debe coincidir con el healthcheck
      - --entrypoints.traefik.address=:8080
      # Redirección de HTTP a HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Nivel de log (LOG_LEVEL en .env)
      - --log.level=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--entrypoints.traefik.address=:8080"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dynamic:/config/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - traefik-public

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
